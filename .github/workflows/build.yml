name: Build AlertMe API

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore packages
        run: dotnet restore dotnetApp.csproj

      # Same command the Dockerfile runs, so this catches what would break a deploy.
      - name: Publish
        run: dotnet publish dotnetApp.csproj -c Release --no-restore -o "$RUNNER_TEMP/publish"
